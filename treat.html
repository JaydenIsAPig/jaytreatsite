<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Treat Details | JayTreats</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="site-config.js"></script>
    <script defer src="treats.js"></script>
    <script defer src="gallery.js"></script>
</head>

<body>
    <header class="hero-section">
        <div class="radial">
            <h1 id="treat-name">Loading...</h1>
        </div>
        <div id="header-slot" class="header-slot"></div>
    </header>

    <main id="treat-detail" class="detail-layout">
        <div class="content-block">
            <img
                id="main-treat-image"
                src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                alt="Treat main view"
                class="main-image-display"
            />
        </div>

        <div class="content-block" id="media-slot">
            <div class="video-container is-hidden" id="video-wrapper">
                <iframe id="video-player" title="Treat video" loading="lazy" allowfullscreen></iframe>
            </div>
        </div>

        <div id="extra-images-container" class="image-grid"></div>
    </main>

    <nav class="home" aria-label="Home">
        <div class="radial">
            <h5>
                <a href="index.html" data-page-link="home" data-config-text="backHomeLabel">Back to Home</a>
            </h5>
        </div>
    </nav>

    <footer class="site-footer insta-container">
        <a href="#" target="_blank" rel="noopener noreferrer" data-social-link="instagram" aria-label="Follow JayTreats on Instagram">
            <img src="images/insta.png" data-social-icon="instagram" alt="Follow us on Instagram" class="social-icon" />
        </a>
        <p class="site-footer-copy">
            &copy; <span data-current-year>2026</span> <span data-site-name>JayTreats</span>
        </p>
    </footer>
</body>

</html>
