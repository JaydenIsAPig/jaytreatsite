<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treat Details | jaytreats</title>
    <link rel="stylesheet" href="style.css">

    <script src="treats.js"></script>
    <script src="gallery.js"></script>

    <style>
        /* --- 1. LAYOUT GRID (The Fix for Widescreen) --- */
        .content-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 0;

            /* MOBILE DEFAULT: Stacked (1 Column) */
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* DESKTOP/WIDESCREEN: Switch to 2-Column Grid */
        @media (min-width: 768px) {
            .content-container {
                display: grid;
                /* This forces exactly 2 items per row (Image Left, Video Right) */
                grid-template-columns: 1fr 1fr;
                gap: 40px;
                align-items: center;
                /* Prevents stretching height */
            }

            /* Make the bottom gallery span the full width of the screen */
            #extra-images-container {
                grid-column: span 2;
            }
        }

        /* --- 2. VIDEO PLAYER --- */
        /* Standard Video (16:9) - The default */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            background-color: #000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* NEW: Shorts Mode (9:16) - Vertical Phone Shape */
        .video-container.shorts-mode {
            padding-bottom: 177.78%;
            /* (16 / 9) * 100 = 177.77...% */
            max-width: 400px;
            /* Optional: Prevents it from being MASSIVE on desktop */
            margin: 0 auto;
            /* Centers it if we limit the width */
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- 3. MAIN IMAGE --- */
        .main-image-display {
            width: 100%;
            height: auto;
            /* Auto height prevents cropping */
            object-fit: contain;
            /* Shows full image always */
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: block;
        }

        /* --- 4. GALLERY GRID (With Border Fix) --- */
        .image-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            margin-top: 20px;

            /* CRITICAL FIX: Stops borders from stretching into empty space */
            align-items: flex-start;
        }

        .gallery-detail-img {
            width: 100%;
            max-width: 300px;
            /* Limits size of individual gallery shots */
            height: auto;
            /* Ensures aspect ratio is kept */
            object-fit: contain;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .gallery-detail-img:hover {
            transform: scale(1.05);
            border-color: #FF69B4;
        }

        /* Ensure content blocks behave well in the grid */
        .content-block {
            width: 100%;
            display: block;
        }
    </style>
</head>

<body>

    <header class="hero-section">
        <h1 id="treat-name">Loading...</h1>
        <h2>Ingredients</h2>
        <p id="ingredient-list" class="ingredient-list"></p>

        <div class="allergen-container">
            <h3 class="allergen-heading">Contains:</h3>
            <p id="allergen-list" class="allergen-list"></p>
        </div>
    </header>

    <main class="content-container">

        <div class="content-block">
            <img id="main-treat-image" src="" alt="Treat Main View" class="main-image-display">
        </div>

        <div class="content-block">
            <div class="video-container">
                <iframe id="video-player" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>

        <div id="extra-images-container" class="image-grid">
        </div>

    </main>

    <script>
        window.onload = function () {
            const params = new URLSearchParams(window.location.search);
            const treatId = params.get('id');

            if (treatId && treatData[treatId]) {
                const treat = treatData[treatId];

                // 1. Text Info
                const nameHeader = document.getElementById('treat-name');
                nameHeader.innerText = treat.name;
                document.getElementById('ingredient-list').innerText = treat.ingredients;
                document.getElementById('allergen-list').innerText = treat.allergens;
                document.title = treat.name + " | jaytreats";

                // 2. VIBE LOGIC (Apply Outline Color)
                if (treat.vibe) {
                    const c = treat.vibe;
                    nameHeader.style.textShadow =
                        `1px 1px 0 ${c}, -1px 1px 0 ${c}, 1px -1px 0 ${c}, -1px -1px 0 ${c}`;
                }

                // ... inside treat.html script ...

                // 3. Video Logic
                const videoFrame = document.getElementById('video-player');
                const videoContainer = videoFrame.closest('.video-container'); // Grab the container to change styling
                const videoBlock = videoFrame.closest('.content-block');

                if (treat.youtubeID) {
                    let rawID = treat.youtubeID;
                    let videoID = rawID;
                    let isShort = false;

                    // Detect if it is a Short based on the URL structure
                    if (rawID.includes('shorts/')) {
                        isShort = true;
                        videoID = rawID.split('shorts/')[1];
                    } else if (rawID.includes('v=')) {
                        videoID = rawID.split('v=')[1].split('&')[0];
                    }

                    // Apply the Fix
                    if (isShort) {
                        videoContainer.classList.add('shorts-mode'); // Switch to vertical shape
                    } else {
                        videoContainer.classList.remove('shorts-mode'); // Ensure standard shape
                    }

                    videoFrame.src = "https://www.youtube.com/embed/" + videoID + "?rel=0&modestbranding=1";

                } else {
                    if (videoBlock) videoBlock.style.display = 'none';
                }

                // 4. Image Logic
                const mainImg = document.getElementById('main-treat-image');
                const extraContainer = document.getElementById('extra-images-container');
                extraContainer.innerHTML = "";

                if (treat.images && treat.images.length > 0) {
                    // Set Main Image
                    mainImg.src = treat.images[0];
                    mainImg.alt = treat.name + " Main View";

                    // Loop Extra Images (Skip the first one)
                    if (treat.images.length > 1) {
                        treat.images.slice(1).forEach(function (imgSrc) {
                            const newImg = document.createElement('img');
                            newImg.src = imgSrc;
                            newImg.className = "gallery-detail-img";
                            newImg.alt = treat.name + " detail shot";
                            extraContainer.appendChild(newImg);
                        });
                    }
                } else {
                    mainImg.style.display = 'none';
                }

            } else {
                document.getElementById('treat-name').innerText = "Treat Not Found";
            }
        };
    </script>
</body>
