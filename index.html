<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>JayTreats | Flavor of the Week</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="site-config.js"></script>
    <script defer src="treats.js"></script>
    <script defer src="gallery.js"></script>
</head>

<body>
    <header class="hero-section">
        <div class="radial">
            <h1 id="treat-name">Loading...</h1>
        </div>
        <h2 data-config-text="homeSubtitle">Click my picture for more info</h2>
    </header>

    <main>
        <section id="featured-treat-section" aria-labelledby="treat-name">
            <div id="featured-treat-container" class="content-container"></div>
        </section>

        <nav class="old-stuff-link" aria-label="Treat archive">
            <div class="radial">
                <a href="gallery.html" data-page-link="gallery" data-config-text="browseArchiveLabel">
                    Or browse all my old stuff
                </a>
            </div>
        </nav>
    </main>

    <footer class="site-footer insta-container">
        <a href="#" target="_blank" rel="noopener noreferrer" data-social-link="instagram" aria-label="Follow JayTreats on Instagram">
            <img src="images/insta.png" data-social-icon="instagram" alt="Follow us on Instagram" class="social-icon" />
        </a>
        <p class="site-footer-copy">
            &copy; <span data-current-year>2026</span> <span data-site-name>JayTreats</span>
        </p>
    </footer>
</body>

</html>
