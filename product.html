<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="View jewelry details, pricing, additional images, and clear ordering information." />
    <title>Jewelry Details | Care for Jewelry</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="site-config.js"></script>
    <script defer src="products.js"></script>
    <script defer src="storefront.js"></script>
</head>

<body>
    <div class="announcement-bar" data-config-text="announcementText">Complimentary gift wrapping on every piece</div>

    <header class="site-header">
        <a class="site-brand" href="index.html" data-page-link="home" aria-label="Caren for Jewelry home">
            <img class="brand-mark" src="images/logo-symbol.svg" alt="" />
            <span class="brand-copy">
                <span class="brand-name" data-site-name>Caren for Jewelry</span>
                <span class="brand-tagline" data-config-text="brandTagline">Jewelry chosen with care</span>
            </span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
            <a href="index.html" data-page-link="home" data-config-text="homeNavLabel">Home</a>
            <a href="gallery.html" data-page-link="gallery" data-config-text="galleryNavLabel">Products</a>
            <a href="index.html#about" data-config-text="aboutNavLabel">Our story</a>
        </nav>
    </header>

    <nav class="breadcrumb detail-breadcrumb" aria-label="Breadcrumb">
        <a href="index.html" data-page-link="home">Home</a>
        <span aria-hidden="true">/</span>
        <a href="gallery.html" data-page-link="gallery">Collection</a>
        <span aria-hidden="true">/</span>
        <span aria-current="page">Piece details</span>
    </nav>

    <!-- storefront.js resolves the ?id= product and fills these detail mounts. -->
    <main id="product-detail" class="detail-layout" aria-live="polite">
        <section class="detail-media" aria-label="Product images">
            <img
                id="main-product-image"
                src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                alt="Product main view"
                class="main-image-display"
            />
        </section>

        <section id="product-info" class="detail-info"></section>

        <section class="detail-gallery" aria-label="Additional product views">
            <div class="image-gallery-heading">
                <h2 data-config-text="galleryImagesLabel">More views</h2>
                <p data-config-text="galleryImagesHelp">Select an image to see it larger.</p>
            </div>
            <div id="extra-images-container" class="image-grid" aria-label="More product images"></div>
            <div id="media-slot" class="media-slot"></div>
        </section>
    </main>

    <nav class="home-link" aria-label="Product gallery">
        <a class="secondary-link" href="gallery.html" data-page-link="gallery" data-config-text="backGalleryLabel">Back to products</a>
    </nav>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-details">
                <p class="footer-title" data-site-name>Caren for Jewelry</p>
                <p data-config-text="siteTagline">Simple jewelry, thoughtfully chosen.</p>
                <div class="social-links" data-social-links aria-label="Social media links"></div>
            </div>

            <form class="email-signup" data-email-signup novalidate>
                <label for="footer-email" data-config-text="emailSignupTitle">Join our email list</label>
                <div class="email-signup-row">
                    <input id="footer-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" data-config-placeholder="emailPlaceholder" required />
                    <button type="submit" data-config-text="emailButtonLabel">Get updates</button>
                </div>
                <p class="form-status" data-email-status aria-live="polite"></p>
            </form>
        </div>
        <p class="site-footer-copy">
            &copy; <span data-current-year>2026</span> <span data-site-name>Caren for Jewelry</span>
        </p>
    </footer>
</body>

</html>
