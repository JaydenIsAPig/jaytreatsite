<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Flavor Gallery | JayTreats</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="site-config.js"></script>
    <script defer src="treats.js"></script>
    <script defer src="gallery.js"></script>
</head>

<body>
    <header class="hero-section hero-section--compact">
        <h1 data-config-text="galleryTitle">The Archives</h1>
        <h2 data-config-text="gallerySubtitle">Taste them all (visually)</h2>
        <div class="search-container">
            <label class="visually-hidden" for="treat-search">Search treats</label>
            <input
                type="text"
                id="treat-search"
                placeholder="Search for your favorites..."
                data-config-placeholder="gallerySearchPlaceholder"
            />
        </div>
    </header>

    <main id="full-gallery" class="gallery-grid" aria-live="polite"></main>

    <nav class="home" aria-label="Home">
        <div class="radial">
            <h5>
                <a href="index.html" data-page-link="home" data-config-text="backHomeLabel">Back to Home</a>
            </h5>
        </div>
    </nav>

    <footer class="site-footer insta-container">
        <a href="#" target="_blank" rel="noopener noreferrer" data-social-link="instagram" aria-label="Follow JayTreats on Instagram">
            <img src="images/insta.png" data-social-icon="instagram" alt="Follow us on Instagram" class="social-icon" />
        </a>
        <p class="site-footer-copy">
            &copy; <span data-current-year>2026</span> <span data-site-name>JayTreats</span>
        </p>
    </footer>
</body>

</html>
